services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meditation
      POSTGRES_USER: meditation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meditation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditation -d meditation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      PORT: "8080"
      JDBC_URL: jdbc:postgresql://postgres:5432/meditation
      JDBC_USER: meditation
      JDBC_PASSWORD: ${POSTGRES_PASSWORD:-meditation}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      AUTH_DEV_ENABLED: ${AUTH_DEV_ENABLED:-false}

volumes:
  pgdata:
